[workspace]
resolver = "3"
members = ["crates/katfile-api", "crates/katfile-mock", "crates/katfile-worker"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "form", "tokio", "matched-path"] }
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
fastrand = "2.5"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4.3"
http-body = "1.1"
http-body-util = "0.1.5"
regex = { version = "1.13", default-features = false, features = ["std", "perf", "unicode-perl"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query", "stream"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3.27"
thiserror = "2.0.21"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "sync", "signal", "net"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.27", features = ["v4"] }

[profile.release]
# Small, predictable binary for the 1 GB VPS.
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
